# Version catalogue.
#
# VERIFIED: the [versions] entries used by :core are compiled and tested in CI
# and in cloud containers, so a bad pin fails loudly and immediately.
#
# UNVERIFIED: agp, composeBom, androidxCore, lifecycle, activityCompose,
# datastore and mediapipe cannot be resolved without dl.google.com, which is
# blocked in the cloud environment this was scaffolded in. They are plausible
# pins, not confirmed ones. The first build on the laptop confirms or bumps
# them. Tracked as CL-04 in CLEANUP.md.

[versions]
kotlin = "2.2.21"
serialization = "1.9.0"
coroutines = "1.10.2"
junit = "5.14.4"

# --- unverified from here down: confirm on first laptop build ---
agp = "8.7.3"
composeBom = "2024.12.01"
androidxCore = "1.15.0"
splashscreen = "1.0.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
datastore = "1.1.1"
# Redesign (Sprint 8): navigation-compose for the 5-tab shell + pushed flows,
# and material-icons-extended for the icon set every screen now uses. Neither
# was resolvable without dl.google.com when pinned — unverified until the
# first laptop build, tracked under the existing CL-04 entry in CLEANUP.md.
navigationCompose = "2.8.5"

# Verified on 24 Sep 2026: com.google.ai.edge.litertlm:litertlm-android
# genuinely resolves on Google's Maven, with real published releases up to
# 0.17.1 — see docs/API_VERIFICATION.md. Pinned to 0.16.1, not latest.release:
# 0.17.0+ depends on kotlin-reflect 2.4.0, whose classes carry Kotlin 2.4.0
# metadata this project's 2.2.21 compiler cannot read at all (not a version
# clash Gradle's resolution strategy can paper over — the library's own
# .class files are unreadable). Every release through 0.16.1 depends on
# kotlin-reflect 2.2.21, matching this project's own Kotlin version exactly.
# Replaces the MediaPipe LLM Inference candidate (mediapipeGenai/tasks-genai)
# SPRINT_4_5 named first: that one never got past "not wired up"; this one is
# a real integration, still unverified on the loaner. See CLEANUP.md CL-18.
litertlm = "0.16.1"

# Verified on 24 Sep 2026: androidx.camera:* and com.google.mlkit:text-recognition
# (the bundled, offline variant — never play-services-mlkit-text-recognition,
# which downloads its model) — see docs/API_VERIFICATION.md and CLEANUP.md
# CL-20. CameraX pinned to 1.5.3, not the newer 1.6.2: 1.6.2's own AAR
# metadata requires Android Gradle Plugin 8.9.1+, this project uses 8.7.3,
# and 1.5.3 only requires 8.6.0+.
cameraX = "1.5.3"
mlkitTextRecognition = "16.0.1"
mlkitBarcodeScanning = "17.3.0"
zxingCore = "3.5.3"

# Verified 24 Sep 2026 straight from developer.android.com — the AppFunctions
# reference pages for AppFunctionService/AppFunction/AppFunctionSerializable/
# AppFunctionServiceEntryPoint/AppFunctionElementNotFoundException/
# AppFunctionInvalidArgumentException all say "Added in 1.0.0-alpha12", and
# the release-notes page (jetpack/androidx/releases/appfunctions) lists
# 1.0.0-alpha12 as the latest release, superseding this project's earlier
# note that alpha11 was current. Still unresolved here: dl.google.com is
# blocked in this environment, so this pin has never actually been fetched —
# see CLEANUP.md CL-24.
appfunctions = "1.0.0-alpha12"

# KSP build matching this project's exact Kotlin version (2.2.21), confirmed
# 24 Sep 2026 from Maven Central's own maven-metadata.xml for
# com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin — reachable
# even where dl.google.com is blocked, since KSP resolves from Central/the
# Gradle Plugin Portal, not Google's Maven.
ksp = "2.2.21-2.0.5"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.14.4" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# --- unverified ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcodeScanning" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
appfunctions = { module = "androidx.appfunctions:appfunctions", version.ref = "appfunctions" }
appfunctions-compiler = { module = "androidx.appfunctions:appfunctions-compiler", version.ref = "appfunctions" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# --- unverified ---
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
