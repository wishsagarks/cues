# Runs the :core test suite on push.
#
# Deliberately not "build" or "android" — this needs no Android SDK, which is
# the whole point. It doubles as a standing check that the SDK-free build
# settings.gradle.kts promises has not regressed: if this workflow ever starts
# reaching for google() or an SDK, something in the :core/:app boundary broke.
name: core

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Core tests
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/
